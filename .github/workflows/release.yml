# SPDX-License-Identifier: EUPL-1.2
# THE INSTALLERS, built on GitHub's STANDARD runners on every published release (and by hand), and the signed list
# that lets an installed copy update itself (src/update/release.ts):
#   build     the tests; the program (scripts/build.ts); Node.js for four systems, each checked against
#             packaging/node.json; the update files (the app, each runtime gzipped)
#   windows   KartaErgasias.exe (csc, packaging/windows/Starter.cs) and the Inno Setup installer
#   mac       «Κάρτα Εργασίας.app», ad-hoc signed, zipped — for Apple silicon and for Intel
#   linux     a .deb and a .tar.gz
#   publish   (a published release only) manifest.json, SHA256SUMS and its signature — the ONE secret,
#             UPDATE_SIGNING_KEY, in the `release` environment, reaches only that step — then the files go onto the release
#   keep      (by hand only) the installers kept as the run's artifact, unsigned
# ⛔ No paid code signing (no Apple or Windows certificate). Actions are pinned to commits. Nothing here reaches ΕΡΓΑΝΗ:
# the tests run against the local fake, behind the fence of test/setup.ts.

name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      node: ${{ steps.version.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: the version — the release's tag (vX.Y.Z), or package.json's when run by hand
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$TAG" ]; then
            if ! [[ "$TAG" =~ ^v[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$ ]]; then echo "a release's tag is vX.Y.Z" >&2; exit 1; fi
            npm version --no-git-tag-version --allow-same-version "${TAG#v}"
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "node=$(node -p "require('./packaging/node.json').version")" >> "$GITHUB_OUTPUT"

      - name: types
        run: npm run typecheck

      - name: tests
        run: npm test

      - name: the program
        run: npm run build:desktop

      - name: Node.js for each system
        run: packaging/runtimes.sh dist/runtimes

      - name: the update files
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NODE: ${{ steps.version.outputs.node }}
        run: |
          mkdir -p dist/parts
          cp dist/desktop/app/app.mjs "dist/parts/karta-app-$VERSION.mjs"
          for system in win32-x64 darwin-arm64 darwin-x64 linux-x64; do
            binary="dist/runtimes/$system/node"
            if [ "$system" = win32-x64 ]; then binary="dist/runtimes/$system/node.exe"; fi
            gzip -9 -n -c "$binary" > "dist/parts/karta-node-v$NODE-$system.gz"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop
          path: |
            dist/desktop
            dist/runtimes
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parts
          path: dist/parts
          retention-days: 7

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop
          path: dist

      - name: the starter and the folder to install
        shell: pwsh
        run: |
          $stage = 'dist\stage'
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item dist\desktop\* $stage -Recurse
          Copy-Item dist\runtimes\win32-x64\node.exe $stage
          Copy-Item dist\runtimes\win32-x64\LICENSE "$stage\licenses\LICENSE-node.txt"
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize "/out:$stage\KartaErgasias.exe" packaging\windows\Starter.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Greek is among Inno Setup's user-contributed translations, which its installation does not carry: taken from
      # Inno Setup's own source at the 6.7.1 release's commit, and checked byte for byte. Not kept in this repository
      # (it names its translators); never committed (.gitignore).
      - name: the installer's Greek screens — Inno Setup's own translation, pinned and checked
        shell: pwsh
        run: |
          $isl = 'packaging\windows\Greek.isl'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/cfdf48923178df4b4f040e038b423aa555a61ffc/Files/Languages/Unofficial/Greek.isl' -OutFile $isl
          $sha = (Get-FileHash $isl -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '39c11b8056209edee6baf8f2e9c72ba5dede63e631391b1d73f7acdd56a899b4') { Write-Error "Greek.isl is not the pinned file ($sha)"; exit 1 }

      - name: the installer
        shell: pwsh
        env:
          KARTA_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $env:KARTA_STAGE = (Resolve-Path dist\stage).Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; if ($LASTEXITCODE -ne 0) { exit 1 } }
          & $iscc packaging\windows\karta.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory dist\out | Out-Null
          Move-Item packaging\windows\karta-ergasias-*-setup.exe dist\out\

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-windows
          path: dist/out
          retention-days: 7

  mac:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop
          path: dist

      - name: the app, for Apple silicon and for Intel
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for arch in arm64 x64; do
            packaging/mac/build-mac.sh dist/desktop "dist/runtimes/darwin-$arch/node" "dist/runtimes/darwin-$arch/LICENSE" "$arch" "$VERSION" dist/out
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-mac
          path: dist/out
          retention-days: 7

  linux:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop
          path: dist

      - name: the .deb and the .tar.gz
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: packaging/linux/build-linux.sh dist/desktop dist/runtimes/linux-x64/node dist/runtimes/linux-x64/LICENSE "$VERSION" dist/out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-linux
          path: dist/out
          retention-days: 7

  publish:
    needs: [build, windows, mac, linux]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only a published release reaches the key, and only through the `release` environment, whose rules live in the
    # repository's settings: `v*` tags only, a required reviewer, and the key itself as an environment secret.
    environment: release
    # The only job that may write: it adds the files to the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{installer-*,parts}'
          merge-multiple: true
          path: dist/release

      - name: the signed list
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
          NODE: ${{ needs.build.outputs.node }}
        run: node packaging/release-files.mjs dist/release "$VERSION" "$NODE" src/update/release.ts

      - name: onto the release — the signed list last, so a copy never sees a release half there
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          find dist/release -type f ! -name 'SHA256SUMS*' -print0 | xargs -0 gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" dist/release/SHA256SUMS dist/release/SHA256SUMS.sig --clobber --repo "$GITHUB_REPOSITORY"

  # By hand: the installers kept with the run, to try them. Not signed, so no installed copy would take them as an update.
  keep:
    needs: [build, windows, mac, linux]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{installer-*,parts}'
          merge-multiple: true
          path: dist/release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/release
          retention-days: 30
