<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" role="img" aria-label="Σχέδιο των Ρυθμίσεων συστήματος, Απόρρητο και ασφάλεια: η γραμμή «Η Κάρτα Εργασίας μπλοκαρίστηκε» με το κουμπί Άνοιγμα ούτως ή άλλως">
  <rect x="1" y="1" width="698" height="298" rx="12" fill="#ffffff" stroke="#c9d3d6"/>
  <rect x="1" y="1" width="200" height="298" rx="12" fill="#eef3f4"/>
  <rect x="190" y="1" width="11" height="298" fill="#eef3f4"/>
  <circle cx="20" cy="20" r="6" fill="#ff5f57"/><circle cx="40" cy="20" r="6" fill="#febc2e"/><circle cx="60" cy="20" r="6" fill="#28c840"/>
  <g fill="#3c4448">
    <text x="20" y="62">Γενικά</text>
    <text x="20" y="90">Εμφάνιση</text>
    <text x="20" y="118">Δίκτυο</text>
  </g>
  <rect x="10" y="132" width="182" height="26" rx="6" fill="#0a84ff"/>
  <text x="20" y="150" fill="#fff" font-weight="600">Απόρρητο και ασφάλεια</text>
  <text x="20" y="182" fill="#3c4448">Κλείδωμα οθόνης</text>
  <text x="684" y="22" text-anchor="end" fill="#9a5b00" font-size="11">ΣΧΕΔΙΟ — όχι η πραγματική οθόνη</text>
  <text x="220" y="52" font-weight="700" font-size="16" fill="#1d2327">Απόρρητο και ασφάλεια</text>
  <text x="220" y="86" fill="#6b7377">… (κυλήστε κάτω-κάτω) …</text>
  <text x="220" y="120" font-weight="700" fill="#1d2327">Ασφάλεια</text>
  <rect x="220" y="132" width="464" height="34" rx="8" fill="#f6f6f6"/>
  <text x="232" y="154" fill="#3c4448">Να επιτρέπονται εφαρμογές από: App Store και αναγνωρισμένους…</text>
  <rect x="220" y="174" width="464" height="64" rx="8" fill="#f6f6f6"/>
  <text x="232" y="198" fill="#1d2327">Η «Κάρτα Εργασίας» μπλοκαρίστηκε</text>
  <text x="232" y="216" fill="#1d2327">για να προστατευτεί το Mac σας.</text>
  <rect x="488" y="188" width="184" height="30" rx="7" fill="#ffffff" stroke="#d13b00" stroke-width="3"/>
  <text x="580" y="208" text-anchor="middle" fill="#1d2327" font-weight="600">Άνοιγμα ούτως ή άλλως</text>
  <text x="220" y="270" fill="#d13b00" font-weight="600">② «Άνοιγμα ούτως ή άλλως» → ο κωδικός του Mac → «Άνοιγμα»</text>
</svg>
